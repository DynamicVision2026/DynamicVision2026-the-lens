  - ja: ABを底辺と見る。ABに平行な直線を動かして、放物線にふれる点で高さが最大（等積変形の線）
    op: note
  - ja: ABの傾きは 1/2×(−3+5) = 1。y = (1/2)x² の接線の傾き x がこれと等しいのは x = 1（AとBのまん中）
    op: note
  - ja: P(1, 1/2)。弦ABと、ABに平行な接線の接点Pでできる△ABPの面積は |a|(β−α)³/8（a は x² の係数、α・β は A・B の x 座標）
    op: note
  - ja: = |1/2|×(5−(−3))³÷8 = 32
    value: '32'
    op: result
