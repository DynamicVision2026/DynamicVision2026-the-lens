    op: note
  - ja: ABの傾きは (4−1)÷(2−(−4)) = 1/2。Qのy座標は 1−1/2×(−4) = 3
    op: note
  - ja: 高さはAからy軸まで 4、Bからy軸まで 2。高さの和は 2−(−4) = 6
    op: note
  - ja: PQ×6÷2 = 15 より、PQ = 15×2÷6 = 5
    op: note
  - ja: Pのy座標 = 3＋5 = 8
