  - ja: 2つの三角形が、底辺AC＝8cmの1つの三角形になる
    op: note
  - ja: 8×4÷2 = 16
    value: '16'
    op: result
trigger:
  ja: 平行線の間に三角形がならび、長さが合計しか分からないときは、頂点をすべらせて1つにまとめる。
  en: 'Triangles between parallel lines with only the total length given: slide the apexes together into one triangle.'
