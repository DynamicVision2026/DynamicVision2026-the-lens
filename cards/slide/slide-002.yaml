    - 3
    - 8
    apex_x:
    - 1
    - 6
    point_labels:
      bottom:
      - A
      - B
      - C
      apex:
      - P
      - Q
    shown:
      total_base: true
      band_height: true
      each_base: false
answer:
  value: '16'
  display_ja: 16cm²
  expr: band_area
