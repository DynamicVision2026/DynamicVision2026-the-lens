schema_version: "1.1"
id: slide-001
kind: standard
lens: slide
best_move: slide
stage: shogakko
grades: [小5, 小6]
status: draft            # flips to verified when WO-004 (band scenes) merges; validator checks it fully either way

provenance:
  original: true
  built_from: "Archetype: several triangles between two parallel lines, bases along one line and apexes on the other; only the total base is given (等積変形: slide every apex to one point)."
  not_derived_from: "Lengths, wording and figure are original. Not adapted from any 入試, textbook or 塾 problem."
  author: "The Lens content team"

grounding:
  principle_ja: "底辺と高さが同じ三角形は、形がちがっても面積が等しい。平行線の上で頂点を動かしても、高さは変わらない。"
  principle_en: "Triangles with the same base and height have equal area; sliding an apex along a parallel line keeps the height, so the area is unchanged."

problem:
  text_ja: "直線ℓと直線mは平行で、その間は6cmです。直線m上のADの長さは10cmで、B、CはAとDの間の点です。P、Q、Rは直線ℓ上の点です。かげをつけた三角形ABP、BCQ、CDRの面積の合計は何cm²ですか。"
  unit: "cm²"
  figure:
    type: parallel_band
    band_height: 6
    bottom_x: [0, 3, 7, 10]          # A, B, C, D on line m
    apex_x: [1, 5, 9]                # P, Q, R on line ℓ
    point_labels: {bottom: [A, B, C, D], apex: [P, Q, R]}
    shown: {total_base: true, band_height: true, each_base: false}

answer:
  value: "30"
  display_ja: "30cm²"
  expr: band_area

trap_route:
  time_cost_sec: 180
  time_source: estimate
  steps:
    - {ja: "三角形を1つずつ「底辺×高さ÷2」で求めようとする", op: note}
    - {ja: "AB、BC、CDの長さが問題に書かれていない", op: note}
    - {ja: "定規で測るしかなく、答えが決まらない", op: note}
    - {ja: "ここで約3分。手が止まる", op: note}

lens_route:
  time_cost_sec: 20
  time_source: estimate
  steps:
    - {ja: "P、Q、Rを直線ℓにそって1点に集める（高さ6cmは変わらない）", op: note}
    - {ja: "3つの三角形が、底辺AD＝10cmの1つの三角形になる", op: note}
    - {ja: "10×6÷2 = 30", value: "30", op: result}

trigger:
  ja: "平行線の間に三角形がならび、長さが合計しか分からないときは、頂点をすべらせて1つにまとめる。"
  en: "Triangles between parallel lines with only the total length given: slide the apexes together into one triangle."
  tags: [parallel_lines, triangles_between_parallels, apexes_on_one_line, only_total_given]

picker:
  options: [slide, enclose, mirror, direct]
  correct: slide
  clue_distractors: [vertices_on_box, solid_3d]
  feedback_ja:
    slide: "そのとおり。頂点は平行線の上を動かしても、高さが変わらないので面積も変わらない。"
    enclose: "方眼の上の図形ではないので、囲んで引くための長さが分からない。"
    mirror: "最短の道すじを求める問題ではない。"
    direct: "1つずつ計算したいが、AB、BC、CDの長さが分からない。"

animation:
  keyframes: [show_band, mark_parallel, slide_apexes, merge_triangle, show_answer]

checks:
  - {type: band_triangles_disjoint}
  - {type: band_total_only}
  - {type: band_area_equals_answer}
  - {type: route_steps_sum, route: lens_route}
  - {type: lens_faster}

variants:
  generator: slide_band
  count: 3
  seed: 2101
  constraints: {min_base: 8, max_base: 14, min_height: 3, max_height: 8}
