  steps:
  - ja: 対角線DBをひく。△DBCの頂点Cを、DBに平行に動かしても面積は変わらない（等積変形）
    op: note
  - ja: Cを、DBに平行な直線にそってx軸まで動かした点がE。このとき △DBE＝△DBC なので、△AED＝四角形ABCD
    op: note
  - ja: DBの傾きは (0−6)÷(3−(−1)) = −3/2
    op: note
  - ja: Cからyが 3 下がる間に、xは 3×4/6 = 2 進む
    op: note
  - ja: Eのx座標 = 5＋2 = 7
    value: '7'
    op: result
