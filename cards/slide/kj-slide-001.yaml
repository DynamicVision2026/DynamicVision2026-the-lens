    enclose: △ABCの面積は囲めば出るが、Pの位置を決めるには遠回り。
    mirror: 最短の道すじを求める問題ではない。
    direct: Pを(0, p)とおいて面積の方程式を立てると、場合分けが出てきて計算が重い。
