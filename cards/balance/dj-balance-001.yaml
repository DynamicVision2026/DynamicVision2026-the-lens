archetype: balance.mass_point
status: verified
provenance:
  original: true
  built_from: 'Archetype: two cevians of a triangle with given division ratios; find the ratio on one cevian by mass points (てんびん = 内分の重み).'
  not_derived_from: Numbers, figure and wording are original. Not adapted from any 入試, textbook or 塾 problem.
  author: The Lens content team
grounding:
  principle_ja: 内分点は、両はしのおもりがつり合う支点。おもりは比の逆。辺ごとのてんびんをつなげば、交点での比が出る。
  principle_en: A dividing point is the fulcrum where the end weights balance (weights inverse to the lengths); chain the levers.
problem:
  text_ja: △ABCで、辺BC上に点DをBD:DC＝2:3となるようにとり、辺CA上に点EをCE:EA＝1:2となるようにとります。ADとBEの交点をPとするとき、AP:PDを最も簡単な整数の比で求めなさい。
  unit: ''
  figure:
    type: triangle_cevians
    bd: 2
    dc: 3
    ce: 1
    ea: 2
answer:
  value: '5'
  display_ja: AP:PD＝5:1
  expr: coordinate
trap_route:
  time_cost_sec: 240
  time_source: estimate
  steps:
  - ja: メネラウスの定理を使おうとして、どの三角形とどの直線を選ぶか迷う
    op: note
  - ja: 比を書き間違えやすく、何度もやり直す
    op: note
  - ja: ここで約4分
    op: note
lens_route:
  time_cost_sec: 60
  time_source: estimate
  steps:
  - ja: 辺BCのてんびん：BD:DC＝2:3 なので、おもりは B:C＝3:2
    op: note
  - ja: 辺CAのてんびん：CE:EA＝1:2 なので、おもりは C:A＝2:1
    op: note
  - ja: Cのおもりをそろえると A:B:C＝1:3:2
    op: note
  - ja: Dには B と C のおもりが集まる：3+2 = 5
    op: note
  - ja: ADのてんびん：AP:PD は おもりの逆で 5:1
    value: '5'
    op: result
trigger:
  ja: 三角形の辺を分ける比が2つ分かり、交点で分ける比を聞かれたら、各頂点におもりをのせる。
  en: 'Two division ratios given, a cevian ratio asked: put weights on the vertices.'
  tags:
  - cevians_ratio
