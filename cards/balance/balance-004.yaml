  steps:
  - ja: 食塩の量を全部出して、最後の重さを□とした式を立てる
    op: note
  - ja: 途中の重さと食塩の量をまちがえやすく、式が長い
    op: note
  - ja: ここで約4分
    op: note
lens_route:
  time_cost_sec: 70
  time_source: estimate
  steps:
  - ja: まず4%と10%をてんびんで混ぜる。重さの比 200:400 = 1:2 なので、うでの長さの比は 2:1
    op: note
  - ja: うでの長さ 10−4 = 6 を 2:1 に分ける。4%からのうでは 6÷3×2 = 4
    op: note
  - ja: 混ぜた食塩水は 4+4 = 8%、重さは 200+400 = 600g
    op: note
  - ja: 次に水（0%）を混ぜる。うでの長さは 8−6 = 2 と 6−0 = 6
    op: note
  - ja: 600g と 水□g の比は 3:1。水 = 600×1÷3 = 200（g）
    value: '200'
    op: result
