  feedback_ja:
    balance: そのとおり。辺ごとにてんびんを考えて、おもりをそろえる。
    area: 面積比を直接つなぐ方法もあるが、たどる三角形が多く遠回り。てんびんで AP:PD を出せば1回で済む。
    slide: 平行な線を使う問題ではない。
    direct: ベクトルや座標で交点を出すこともできるが、連立方程式が重い。
