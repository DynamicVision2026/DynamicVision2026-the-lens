  - ja: まず6%と11%をてんびんで混ぜる。重さの比 200:300 = 2:3 なので、うでの長さの比は 3:2
    op: note
  - ja: うでの長さ 11−6 = 5 を 3:2 に分ける。6%からのうでは 5÷5×3 = 3
    op: note
  - ja: 混ぜた食塩水は 6+3 = 9%、重さは 200+300 = 500g
    op: note
  - ja: 次に水（0%）を混ぜる。うでの長さは 9−5 = 4 と 5−0 = 5
    op: note
  - ja: 500g と 水xg の比は 5:4。水 = 500×4÷5 = 400（g）
    value: '400'
    op: result
