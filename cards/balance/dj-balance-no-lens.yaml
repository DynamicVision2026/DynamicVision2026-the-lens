    balance: おもりでも出せるが、ここでは遠回り。△ABDは交点Pを使っていない。
    area: 面積図（つるかめ算）の問題ではない。
    slide: 平行な線で頂点を動かす問題ではない。
    direct: そのとおり。高さが共通なので、面積の比は底辺の比 BD:BC。
