grounding:
  principle_ja: 平均は、何に対する平均かで重みが変わる。速さの平均は時間が重み。往復では遅い方に長くいるので、ちょうどまん中にはならない。
  principle_en: An average's weights depend on what it averages over; speed is averaged over time, and the slower leg takes longer.
problem:
  text_ja: A地点とB地点の間を、行きは時速4km、帰りは時速6kmで往復しました。往復の平均の速さは時速何kmですか。
  unit: km/時
  figure:
    type: word_problem
    kind: avg_speed
    params:
      u: 4
      v: 6
answer:
  value: 24/5
  display_ja: 時速24/5km
  expr: word_problem
trap_route:
  time_cost_sec: 60
  time_source: estimate
  steps:
  - ja: 2つの速さをてんびんの両はしにおき、まん中を平均とする
    op: note
  - ja: 道のりは同じでも、かかる時間がちがうので、重みは同じではない
    op: note
  - ja: まん中の値は答えにならない
    op: note
lens_route:
  time_cost_sec: 40
  time_source: estimate
  steps:
  - ja: 平均の速さ＝全体の道のり÷全体の時間。速さの平均 (4+6)÷2 ではない（遅い帰りの方が時間が長い）
    op: note
  - ja: 片道を4と6の最小公倍数 12km とすると、行き 12÷4 = 3時間、帰り 12÷6 = 2時間
    op: note
  - ja: 往復 24km を 5 時間で進むので、24÷5 = 24/5（km/時）
    value: 24/5
    op: result
trigger:
