  built_from: 'Archetype: the average speed of a round trip; the plain average of the two speeds (a lever with equal weights) is the trap, the weights are the TIMES, not the distances (failure card for てんびん).'
  not_derived_from: Numbers and wording are original. Not adapted from any 入試, textbook or 塾 problem.
