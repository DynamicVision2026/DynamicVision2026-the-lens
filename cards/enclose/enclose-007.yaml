schema_version: "1.1"
id: enclose-007
kind: standard
lens: enclose
best_move: enclose
stage: shogakko
grades: [小6]
level: 4             # 1 基礎 · 2 標準 · 3 応用 · 4 発展
archetype: enclose.octagon_large
status: verified

provenance:
  original: true
  built_from: "Archetype: lattice octagon on a large grid, four edges on the box and four tilted edges of different sizes (box minus four unequal right triangles, half-unit answer)."
  not_derived_from: "Coordinates, wording and figure are original. Not adapted from any 入試, textbook or 塾 problem."
  author: "The Lens content team"

grounding:
  principle_ja: "面積の加法性：辺が8本あっても、囲んだ長方形から、すみの4つの直角三角形を引けば求まる。"
  principle_en: "Additivity of area: the shape is the enclosing rectangle minus the right triangles at its corners."

problem:
  text_ja: "方眼の1目もりは1cmです。八角形ABCDEFGHの面積は何cm²ですか。"
  unit: "cm²"
  figure:
    type: grid_polygon
    grid: {width: 10, height: 9, cell_cm: 1}
    points: [[2, 0], [6, 0], [10, 3], [10, 8], [9, 9], [3, 9], [0, 5], [0, 3]]

answer:
  value: "149/2"
  display_ja: "74.5cm²"
  expr: polygon_area

trap_route:
  time_cost_sec: 240
  time_source: estimate
  steps:
    - {ja: "八角形を中心から8つの三角形に分けようとする", op: note}
    - {ja: "三角形の底辺も高さも方眼から読めず、数が多すぎる", op: note}
    - {ja: "ここで約4分。とちゅうで計算をまちがえやすい", op: note}

lens_route:
  time_cost_sec: 30
  time_source: estimate
  steps:
    - {ja: "10×9の長方形で囲む", value: "90", op: start}
    - {ja: "右下の三角形 4×3÷2", value: "6", op: sub}
    - {ja: "右上の三角形 1×1÷2", value: "1/2", op: sub}
    - {ja: "左上の三角形 3×4÷2", value: "6", op: sub}
    - {ja: "左下の三角形 2×3÷2", value: "3", op: sub}
    - {ja: "90 − 15.5 = 74.5", value: "149/2", op: result}

trigger:
  ja: "辺が多い図形でも、頂点が外わくに乗っていれば、囲んで、すみだけ引く。"
  en: "However many sides: if every vertex is on the box, enclose it and subtract the corners."
  tags: [grid, vertices_on_box]

fails_when: enclose-f01

picker:
  options: [enclose, slide, mirror, direct]
  correct: enclose
  clue_distractors: [base_on_grid_line, parallel_lines]
  feedback_ja:
    enclose: "そのとおり。頂点がすべて外側の長方形の辺に乗っている。"
    slide: "平行な2本の線の間に三角形がならぶ形ではない。"
    mirror: "最短の道すじを求める問題ではない。"
    direct: "八角形の公式を使うには、方眼の線に乗った辺と高さが必要。ここではどちらも読めない。"

animation:
  keyframes: [show_shape, draw_box, shade_corners, label_corners, subtract, show_answer]

checks:
  - {type: lattice_only}
  - {type: simple_polygon}
  - {type: area_equals_answer}
  - {type: enclose_clean}
  - {type: route_steps_sum, route: lens_route}
  - {type: lens_faster}

variants:
  generator: enclose_standard
  count: 0                 # archetype generator to come; lesson practice uses the other Enclose cards' variants
  seed: 1000
