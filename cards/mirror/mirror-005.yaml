archetype: mirror.two_lines
status: verified
provenance:
  original: true
  built_from: 'Archetype: shortest path touching two perpendicular lines in a given order; reflect once across each line (折り返す twice).'
  not_derived_from: Lengths, story and wording are original. Not adapted from any 入試, textbook or 塾 problem.
  author: The Lens content team
grounding:
  principle_ja: 2本の線にふれるなら、2回折り返す。折り返しても道のりは変わらないので、まっすぐ結んだ線が最短。
  principle_en: 'Two lines to touch: reflect twice; the straight line is shortest.'
problem:
  text_ja: 点Oで直角に交わる2本の直線ℓ、mがあります。点Pは直線mから1m、直線ℓから4mのところに、点Qは直線mから9m、直線ℓから6mのところにあります（PもQも、ℓとmにはさまれた同じ側にあります）。PからQまで、とちゅうで直線m、直線ℓの順に1回ずつふれて行きます。道のりがいちばん短くなるとき、直線ℓにふれる点からOまでのきょりは何mですか。
  unit: m
  figure:
    type: mirror_corner
    P:
    - 1
    - 4
    Q:
    - 9
    - 6
    unit: m
answer:
  value: '3'
  display_ja: 3m
  expr: corner_touch
trap_route:
  time_cost_sec: 300
  time_source: estimate
  steps:
  - ja: 1回だけ折り返して考えようとする
    op: note
  - ja: もう1本の線にもふれなければならず、道がまっすぐにならない
    op: note
  - ja: ふれる点を少しずつずらして比べるが、決め手がない。約5分
    op: note
lens_route:
  time_cost_sec: 60
  time_source: estimate
  steps:
  - ja: Pを直線mで折り返した点P'をとる（mまでの道のりはそのまま）
    op: note
  - ja: Qを直線ℓで折り返した点Q'をとる（ℓからの道のりもそのまま）
    op: note
  - ja: P'とQ'をまっすぐ結ぶ。直線m、直線ℓと交わる点が、ふれる点
    op: note
  - ja: P'からQ'へ、横に 1+9 = 10 進む間に、たてに 4+6 = 10 下がる。ℓまで（たて4下がる間）に横へ 10×4/10 = 4 進む
    op: note
  - ja: Oからのきょり = 4−1 = 3
    value: '3'
    op: result
trigger:
  ja: 2本の線に1回ずつふれる最短の道は、それぞれの線で折り返して、まっすぐ結ぶ。
  en: 'Touch two lines once each: reflect across each and join straight.'
  tags:
  - two_walls
  - shortest_path
