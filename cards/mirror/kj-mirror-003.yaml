  time_cost_sec: 180
  time_source: estimate
  steps:
  - ja: Pを(p, 0)とおいて、AP＋PBをpの式で表そうとする
    op: note
  - ja: ルートが2つ出てきて、最小が出せない
    op: note
  - ja: ここで約3分
    op: note
lens_route:
  time_cost_sec: 30
  time_source: estimate
  steps:
  - ja: Bをx軸で折り返した点B'(5, −6)をとる（PB＝PB'）
