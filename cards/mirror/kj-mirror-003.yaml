  - ja: AとB'をまっすぐ結ぶ。x軸との交点がP
    op: note
  - ja: yが 2+6 = 8 下がる間にxは 5−(−3) = 8 進むので、Pのx座標は −3+8×2/8 = −1
    value: '-1'
    op: result
trigger:
