provenance:
  original: true
  built_from: 'Archetype: shortest path touching a straight river once, both points on the same side; reflect one point (折り返す, level 1).'
  not_derived_from: Lengths, story and wording are original. Not adapted from any 入試, textbook or 塾 problem.
  author: The Lens content team
grounding:
  principle_ja: 2点を結ぶ線のうち、いちばん短いのはまっすぐな線。折り返しても長さは変わらないので、折り返した点とまっすぐ結べば最短になる。
  principle_en: The straight segment is the shortest path; reflection preserves length, so the straight line to the reflected point gives the shortest touching path.
problem:
  text_ja: 点Pと点Qは、まっすぐな川（直線ℓ）の同じ側にあります。PとQから川に垂直に下ろした点をA、Bとすると、PA＝3m、QB＝6m、AB＝9mです。PからQまで、とちゅうで川の点Xに1回よって水をくんでいきます。道のりがいちばん短くなるとき、AXは何mですか。
  unit: m
  figure:
    type: mirror_path
    ab: 9
    pa: 3
    qb: 6
    unit: m
    point_labels:
      P: P
      Q: Q
      A: A
      B: B
      X: X
      Q_reflected: Q'
answer:
  value: '3'
  display_ja: 3m
  expr: mirror_touch
trap_route:
  time_cost_sec: 120
  time_source: estimate
  steps:
  - ja: AとBのまん中によればいい、と考える
    op: note
  - ja: PA と QB の長さがちがうので、まん中では最短にならない
    op: note
  - ja: Xを少しずつずらして道のりを比べようとするが、長さが計算できない
    op: note
  - ja: ここで約2分。決め手がない
    op: note
lens_route:
  time_cost_sec: 25
  time_source: estimate
  steps:
  - ja: Qを川で折り返した点Q'をとる（XQ＝XQ'）
    op: note
  - ja: PからQ'へまっすぐ線を引く。川と交わる点がX
    op: note
  - ja: 三角形PAXとQ'BXは同じ形なので AX:XB = 3:6 = 1:2
    op: note
  - ja: AX = 9×1/3 = 3
    value: '3'
    op: result
trigger:
  ja: とちゅうで直線に1回ふれる最短の道は、片方の点を折り返して、まっすぐ結ぶ。
  en: 'Shortest path that must touch a line once: reflect one point across the line and join with a straight line.'
  tags:
  - shortest_path
  - touch_a_line
  - two_points_same_side
