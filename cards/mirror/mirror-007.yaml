  time_cost_sec: 90
  time_source: estimate
  steps:
  - ja: くせでQを川で折り返す
    op: note
  - ja: 折り返すとQ'がPと同じ側にきて、かえって遠回りになる
    op: note
  - ja: ここで約1分半まよう
    op: note
lens_route:
  time_cost_sec: 25
  time_source: estimate
  steps:
  - ja: PとQは川の反対側にある。まっすぐ結ぶだけで川を通る（折り返しはいらない）
    op: note
  - ja: PとQをまっすぐ結ぶ。川と交わる点がX
    op: note
  - ja: 三角形PAXとQBXは同じ形なので AX:XB = 2:5
    op: note
  - ja: AX = 14×2/7 = 4
