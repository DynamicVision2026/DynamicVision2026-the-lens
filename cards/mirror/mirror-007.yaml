problem:
  text_ja: 点Pと点Qは、まっすぐな川（直線ℓ）をはさんで反対側にあります。PとQから川に垂直に下ろした点をA、Bとすると、PA＝2m、QB＝5m、AB＝14mです。PからQまで、とちゅうで川の上の点Xを通って行きます。道のりがいちばん短くなるとき、AXは何mですか。
  unit: m
  figure:
    type: mirror_path
    ab: 14
    pa: 2
    qb: 5
    unit: m
    point_labels:
      P: P
      Q: Q
      A: A
      B: B
      X: X
      Q_reflected: Q'
    side: opposite
answer:
  value: '4'
  display_ja: 4m
  expr: mirror_touch
