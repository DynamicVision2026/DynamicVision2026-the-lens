grounding:
  principle_ja: 長さが決まっている部分（橋）は、どこにあっても同じ。その分だけ点をずらすと、残りがまっすぐな1本の道になる。
  principle_en: 'A fixed-length piece (the bridge) can be moved anywhere: shift a point by it and the rest is one straight line.'
problem:
  text_ja: 川はば5mのまっすぐな川があります。点Pは北の岸から4m、点Qは南の岸から8mはなれたところにあります。PとQから岸に垂直にひいた線が北の岸、南の岸と交わる点をA、Bとすると、岸にそってはかったAとBの間は18mです。川に垂直な橋を1本かけて、PからQまで行く道のりをいちばん短くします。橋は、北の岸のAから何mのところにかければよいですか。
  unit: m
  figure:
    type: river_bridge
    pa: 4
    qb: 8
    ab: 18
    w: 5
    unit: m
answer:
  value: '6'
  display_ja: 6m
  expr: bridge
