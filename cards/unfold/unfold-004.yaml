grounding:
  principle_ja: 立体の表面を通る道は、面を開いて平面にしても長さは変わらない。平面では、2点を結ぶいちばん短い線はまっすぐな線。
  principle_en: Opening faces flat preserves path length; on the flat net the straight segment is the shortest path.
problem:
  text_ja: 直方体ABCD-EFGHがあり、AB＝3cm、BC＝4cm、AE＝10cmです。頂点Aから、辺BF上の点P、辺CG上の点Qを通って頂点Hまで、直方体の表面に糸をぴんとかけます。糸の長さがいちばん短くなるとき、CQは何cmですか。
  unit: cm
  figure:
    type: box_unfold
    a: 3
    b: 4
    h: 10
    unit: cm
    point_labels:
      A: A
      B: B
      C: C
      D: D
      E: E
      F: F
      G: G
      H: H
      P: P
    route: three_faces
answer:
  value: '7'
  display_ja: 7cm
  expr: unfold_cross
trap_route:
  time_cost_sec: 300
  time_source: estimate
  steps:
  - ja: BFとCGを、それぞれまん中で通ればいいと考える
    op: note
  - ja: 面ごとに長さを比べようとするが、ななめの長さが計算できない
    op: note
  - ja: PとQを少しずつずらしても決め手がない。約5分
    op: note
lens_route:
  time_cost_sec: 60
  time_source: estimate
  steps:
  - ja: 面ABFE、BCGF、CDHGの3つを開いて、1つの長方形にする（横 3+4+3 = 10、たて 10）
    op: note
  - ja: 開いた図でAとHをまっすぐ結ぶ。辺BFと交わる点がP、辺CGと交わる点がQ
    op: note
  - ja: Aから横に10進む間に10上がるので、横に 3+4 = 7 進んだCGでは 10×7/10 上がる
    op: note
  - ja: CQ = 10×7/10 = 7
    value: '7'
    op: result
trigger:
  ja: 立体の表面をいくつかの面にまたがる最短の道は、通る面を全部開いて、まっすぐ結ぶ。
  en: 'A shortest path over several faces: open every face it crosses and join straight.'
