grounding:
  principle_ja: 円すいの側面は、開くとおうぎ形。中心角は 360°×半径/母線。開いた図で、まっすぐ結んだ線が最短。
  principle_en: A cone's side opens into a sector of angle 360°×r/l; the shortest path is the straight segment on it.
problem:
  text_ja: 底面の半径が1cm、母線の長さが4cmの円すいがあります。頂点をOとし、母線OA上にOB＝3cmとなる点Bをとります。点Aから側面を1周して点Bまで糸をかけるとき、糸の長さの最小値を求めなさい。
  unit: cm
  figure:
    type: cone_unfold
    r: 1
    l: 4
    ask: to_point
    d: 3
