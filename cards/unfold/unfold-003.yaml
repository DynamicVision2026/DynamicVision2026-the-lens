  feedback_ja:
    unfold: そのとおり。面を開いても糸の長さは変わらないので、展開図でまっすぐ結んだ線が最短になる。
    mirror: おしい。まっすぐにする発想は同じだが、ここでは直線で折り返すのではなく、立体の面を開く。
    enclose: 方眼の上の図形の面積ではない。立体の表面の道すじの問題。
    direct: BFのまん中を通るのが最短とは限らない。ABとBCの長さがちがう。
