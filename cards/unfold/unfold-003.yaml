grounding:
  principle_ja: 立体の表面を通る道は、面を開いて平面にしても長さは変わらない。平面では、2点を結ぶいちばん短い線はまっすぐな線。
  principle_en: Opening faces flat preserves path length; on the flat net the straight segment is the shortest path.
problem:
  text_ja: 直方体ABCD-EFGHがあり、AB＝9cm、BC＝6cm、AE＝10cmです。頂点Aから辺BF上の点Pを通って頂点Gまで、直方体の表面に糸をぴんとかけます。糸の長さがいちばん短くなるとき、BPは何cmですか。
  unit: cm
  figure:
    type: box_unfold
    a: 9
    b: 6
    h: 10
    unit: cm
    point_labels:
      A: A
      B: B
      C: C
      D: D
      E: E
      F: F
      G: G
      H: H
      P: P
answer:
  value: '6'
  display_ja: 6cm
  expr: unfold_cross
trap_route:
  time_cost_sec: 240
  time_source: estimate
  steps:
  - ja: BFのまん中を通ればいい、と考える
    op: note
  - ja: ABとBCの長さがちがうので、まん中では最短にならない
    op: note
  - ja: 立体の図のまま、糸の長さを比べようとするが、ななめの長さが計算できない
    op: note
  - ja: ここで約4分。決め手がない
    op: note
lens_route:
  time_cost_sec: 45
  time_source: estimate
  steps:
  - ja: 辺BFでつながった面ABFEと面BCGFを開いて、1つの長方形にする（横 9+6 = 15、たて 10）
    op: note
  - ja: 開いた図でAとGをまっすぐ結ぶ。辺BFと交わる点がP
    op: note
  - ja: 三角形ABPとACGは同じ形なので BP:CG = AB:AC = 9:15 = 3:5
    op: note
  - ja: BP = 10×3/5 = 6
    value: '6'
    op: result
trigger:
  ja: 立体の表面を通る最短の道は、面を開いて展開図にし、まっすぐ結ぶ。
  en: 'Shortest path on the surface of a solid: open the faces into a net and join with a straight line.'
  tags:
