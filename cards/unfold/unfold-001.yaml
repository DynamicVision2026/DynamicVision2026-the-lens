schema_version: "1.1"
id: unfold-001
kind: standard
lens: unfold
best_move: unfold
stage: shogakko
grades: [小6]
level: 2             # 1 基礎 · 2 標準 · 3 応用 · 4 発展
archetype: unfold.box_one_edge
status: verified

provenance:
  original: true
  built_from: "Archetype: shortest string on the surface of a cuboid crossing one edge (open the two faces flat along the shared edge; the straight line gives the crossing point; similar triangles give its position)."
  not_derived_from: "Lengths, story and wording are original. Not adapted from any 入試, textbook or 塾 problem."
  author: "The Lens content team"

grounding:
  principle_ja: "立体の表面を通る道は、面を開いて平面にしても長さは変わらない。平面では、2点を結ぶいちばん短い線はまっすぐな線。"
  principle_en: "Opening faces flat preserves path length; on the flat net the straight segment is the shortest path."

problem:
  text_ja: "直方体ABCD-EFGHがあり、AB＝6cm、BC＝4cm、AE＝5cmです。頂点Aから辺BF上の点Pを通って頂点Gまで、直方体の表面に糸をぴんとかけます。糸の長さがいちばん短くなるとき、BPは何cmですか。"
  unit: "cm"
  figure:
    type: box_unfold
    a: 6
    b: 4
    h: 5
    unit: "cm"
    point_labels: {A: A, B: B, C: C, D: D, E: E, F: F, G: G, H: H, P: P}

answer:
  value: "3"
  display_ja: "3cm"
  expr: unfold_cross

trap_route:
  time_cost_sec: 180
  time_source: estimate
  steps:
    - {ja: "BFのまん中を通ればいい、と考える", op: note}
    - {ja: "ABとBCの長さがちがうので、まん中では最短にならない", op: note}
    - {ja: "立体の図のまま、糸の長さを比べようとするが、ななめの長さが計算できない", op: note}
    - {ja: "ここで約3分。決め手がない", op: note}

lens_route:
  time_cost_sec: 40
  time_source: estimate
  steps:
    - {ja: "辺BFでつながった面ABFEと面BCGFを開いて、1つの長方形にする（横 6+4 = 10、たて 5）", op: note}
    - {ja: "開いた図でAとGをまっすぐ結ぶ。辺BFと交わる点がP", op: note}
    - {ja: "三角形ABPとACGは同じ形なので BP:CG = AB:AC = 6:10 = 3:5", op: note}
    - {ja: "BP = 5×3/5 = 3", value: "3", op: result}

trigger:
  ja: "立体の表面を通る最短の道は、面を開いて展開図にし、まっすぐ結ぶ。"
  en: "Shortest path on the surface of a solid: open the faces into a net and join with a straight line."
  tags: [solid_3d, path_on_surface, shortest_path]

picker:
  options: [unfold, mirror, enclose, direct]
  correct: unfold
  clue_distractors: [two_points_same_side, parallel_lines]
  feedback_ja:
    unfold: "そのとおり。面を開いても糸の長さは変わらないので、展開図でまっすぐ結んだ線が最短になる。"
    mirror: "おしい。まっすぐにする発想は同じだが、ここでは直線で折り返すのではなく、立体の面を開く。"
    enclose: "方眼の上の図形の面積ではない。立体の表面の道すじの問題。"
    direct: "BFのまん中を通るのが最短とは限らない。ABとBCの長さがちがう。"

animation:
  keyframes: [show_box, try_midpoint, unfold_faces, draw_straight, mark_similar, show_answer]

checks:
  - {type: text_matches}
  - {type: unfold_cross_point}
  - {type: unfold_shortest}
  - {type: unfold_not_midpoint}
  - {type: route_steps_sum, route: lens_route}
  - {type: lens_faster}

variants:
  generator: box_unfold
  count: 3
  seed: 2401
  constraints: {min_side: 2, max_side: 12, min_h: 3, max_h: 15}
