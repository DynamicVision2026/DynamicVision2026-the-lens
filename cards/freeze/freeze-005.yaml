  principle_en: Freeze one; the other closes at the speed difference over the sum of lengths.
problem:
  text_ja: 長さ180mで秒速25mの列車Aが、同じ向きに走る長さ140mで秒速17mの列車Bに、うしろから追いつきました。Aの先頭がBの最後尾に追いついてから、AがBを完全に追いこすまで、何秒かかりますか。
