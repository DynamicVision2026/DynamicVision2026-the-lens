  feedback_ja:
    freeze: おしい。速さの問題だが、動くのは1人だけ。止める相手がいない。
    constant: 差が変わらないものを使う問題ではない。
    area: そのとおり。縦＝速さ、横＝時間。全部歩いたとした距離と、実際の距離の差がはみ出した部分。
    direct: 連立方程式でも解けるが、面積図なら引き算とわり算だけ。
