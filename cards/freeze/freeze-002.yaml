  time_cost_sec: 120
  time_source: estimate
  steps:
  - ja: 1分後、2分後…と、2人がいる場所を表に書いて比べる
    op: note
  - ja: 弟は先に出ているので、表がずれてまちがえやすい
    op: note
  - ja: ここで約2分
    op: note
