  principle_en: Freeze the one in front; the chaser closes at the speed difference.
problem:
  text_ja: 弟が家を出て、分速60mで歩き始めました。その10分後に、兄が家を出て、分速100mで同じ道を追いかけます。兄が弟に追いつくのは、兄が家を出てから何分後ですか。
