archetype: freeze.speed_change_failure
status: verified
provenance:
  original: true
  built_from: 'Archetype: one person changes speed midway with known total time and total distance: nobody to freeze; it is a つるかめ area diagram (failure card for 止める, best move 面積図).'
  not_derived_from: Numbers, story and wording are original. Not adapted from any 入試, textbook or 塾 problem.
  author: The Lens content team
grounding:
  principle_ja: 速さ×時間＝道のりは長方形の面積。2つの速さを長方形2つでならべると、つるかめ算と同じになる。
  principle_en: Speed × time = distance is a rectangle; two speeds make a two-rectangle area diagram.
problem:
  text_ja: 家から2000mはなれた公園まで行きます。はじめは分速100mで走り、とちゅうから分速60mで歩いたところ、全部で24分かかりました。分速100mで走ったのは何分間ですか。
  unit: 分
  figure:
    type: word_problem
    kind: speed_change
    params:
      d: 2000
      u: 100
      v: 60
      T: 24
answer:
  value: '14'
  display_ja: 14分
  expr: word_problem
trap_route:
  time_cost_sec: 180
  time_source: estimate
  steps:
  - ja: 速さの問題なので、くせで「止める」を使おうとする
    op: note
  - ja: 動く人が1人しかいないので、止める相手がいない
    op: note
  - ja: ここで約3分止まる
    op: note
lens_route:
  time_cost_sec: 40
  time_source: estimate
  steps:
  - ja: たて＝速さ、横＝時間の長方形2つで表す（面積＝道のり）
    op: note
  - ja: 全部歩いたとすると 60×24 = 1440
    op: note
  - ja: 本当の道のりとの差 2000−1440 = 560 が、上にはみ出した長方形の面積
    op: note
  - ja: その長方形のたては 100−60 = 40
    op: note
  - ja: 走った時間 = 560÷40 = 14（分）
    value: '14'
    op: result
trigger:
  ja: 1人がとちゅうで速さを変え、合計の時間と道のりが分かるときは、面積図にする。
  en: 'One mover changing speed, total time and distance known: area diagram.'
