  not_derived_from: Numbers, story and wording are original. Not adapted from any 入試, textbook or 塾 problem.
  author: The Lens content team
grounding:
  principle_ja: 同じ数ずつある2種類は、1個ずつ組にすると「平均の値段のもの」が2個あるのと同じ。そうすれば2種類の面積図になる。
  principle_en: Two kinds in equal numbers act like items at their average price; pairing them turns three kinds into a two-rectangle area diagram.
problem:
  text_ja: 1個80円、60円、40円の3種類のお菓子を合わせて20個買い、代金は1240円でした。60円と40円のお菓子は同じ数です。80円のお菓子は何個買いましたか。
  unit: 個
  figure:
    type: word_problem
    kind: three_kinds_equal
    params:
      n: 20
      a: 80
      b: 60
      c: 40
      t: 1240
    names:
      item: お菓子
      a: 80円のお菓子
      b: 平均50円
      counter: 個
      measure: 金額
answer:
  value: '8'
  display_ja: 8個
  expr: word_problem
trap_route:
  time_cost_sec: 240
  time_source: estimate
  steps:
  - ja: 80円のお菓子が1個、2個…と決め、残りを60円と40円に半分ずつ分けて代金を計算する
    op: note
  - ja: 残りが奇数のときは分けられず、ためし直しが多い
    op: note
  - ja: ここで約4分
    op: note
lens_route:
  time_cost_sec: 50
  time_source: estimate
  steps:
  - ja: 60円と40円は同じ数なので、1個ずつ組にすると平均 (60+40)÷2 = 50 円
    op: note
  - ja: 全部50円だとすると 50×20 = 1000
    op: note
  - ja: 本当の代金との差 1240−1000 = 240 が、上にはみ出した長方形の面積
    op: note
  - ja: その長方形のたては 80−50 = 30
    op: note
  - ja: 80円の数 = 240÷30 = 8（個）
    value: '8'
    op: result
trigger:
  ja: 3種類でも、同じ数の2種類を組にして平均にすれば、2種類の面積図になる。
  en: 'Three kinds with two in equal numbers: pair them at their average, then use the two-rectangle area diagram.'
