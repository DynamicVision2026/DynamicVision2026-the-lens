  - mixing
  feedback_ja:
    area: そのとおり。平均の線より上にはみ出した面積と、下のへこみの面積が等しくなる。
    balance: おしい。てんびんでも解けるが、ここでは人数と点数の長方形で、はみ出しとへこみを比べると見えやすい。
    constant: 差が変わらないものを使う問題ではない。
    direct: 人数をxとおくと、合計点の方程式になる。解けるが、面積図なら引き算とわり算だけ。
