      a: 自動車
      b: 自転車
      counter: 台
      part: タイヤ
      unit: 本
      measure: タイヤの数
answer:
  value: '8'
  display_ja: 8台
  expr: word_problem
trap_route:
  time_cost_sec: 150
  time_source: estimate
  steps:
  - ja: 自動車が1台、2台、3台…のときのタイヤの数を表にして、1つずつ調べる
    op: note
  - ja: 何通りもあり、どこで合計の本数になるか分かりにくい
    op: note
  - ja: ここで約2分半。表が長くなる
    op: note
lens_route:
  time_cost_sec: 35
  time_source: estimate
  steps:
  - ja: たて＝1台あたりのタイヤの数、横＝台数の長方形2つで表す（面積＝タイヤの数）
    op: note
  - ja: 全部自転車だとすると 2×18 = 36
    op: note
  - ja: 本当のタイヤの数との差 52−36 = 16 が、上にはみ出した長方形の面積
    op: note
  - ja: その長方形のたては 4−2 = 2
    op: note
  - ja: 自動車の数 = 16÷2 = 8
    value: '8'
    op: result
trigger:
  ja: 2種類がまざっていて、全部の数と合計だけ分かるときは、長方形2つの面積図にする。
  en: 'Two kinds mixed, only the total count and total known: two rectangles as an area diagram.'
