    balance: 濃度や平均を混ぜる問題ではない。
    constant: 差や合計が変わらないことを使う問題ではない。
    area: そのとおり。全員を中学生として計算し、実際の合計との差の分だけ大人がいる。
    direct: 連立方程式でも解けるが、係数が大きく、加減法の計算が重い。
