grounding:
  principle_ja: 3人の和は1年に3才、1人は1才ふえるので、差は変わらないのではなく、1年に2ずつちぢむ。ちぢむ速さで割ればよい。
  principle_en: A sum of three grows by 3 a year and one person by 1, so the gap shrinks by 2 a year; divide by that closing rate.
problem:
  text_ja: いま、お父さんは45才で、3人の子どもは9才、7才、5才です。お父さんの年れいが、子ども3人の年れいの和と等しくなるのは何年後ですか。
  unit: 年後
  figure:
    type: word_problem
    kind: sum_catchup
    params:
      p: 45
      c1: 9
      c2: 7
      c3: 5
answer:
  value: '12'
  display_ja: 12年後
  expr: word_problem
