lens_route:
  time_cost_sec: 35
  time_source: estimate
  steps:
  - ja: 子ども3人の年れいの和は 9+7+5 = 21
    op: note
  - ja: お父さんとの差は 45−21 = 24
    op: note
  - ja: 1年で、子ども3人の和は3才、お父さんは1才ふえる。差は1年に 3−1 = 2 ずつちぢむ
    op: note
  - ja: 24÷2 = 12（年後）
    value: '12'
    op: result
