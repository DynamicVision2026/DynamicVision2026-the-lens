  steps:
  - ja: 現在からx年後（前）として、両方の量をxの式で表す
    op: note
  - ja: 「何倍」の関係から方程式を立て、かっこをはずして解く
    op: note
  - ja: ここで約2分半。式の立て方で迷いやすい
    op: note
lens_route:
  time_cost_sec: 25
  time_source: estimate
  steps:
  - ja: 年齢の差は 44−12 = 32 で、何年たっても変わらない
    op: note
  - ja: 父が健太の3倍のとき、差の32は健太の 3−1 = 2 つ分
    op: note
  - ja: そのときの健太は 32÷2 = 16 歳
    op: note
  - ja: 16−12 = 4（年後）
    value: '4'
    op: result
