grounding:
  principle_ja: 2人は同じだけ年をとるので、年齢の差はずっと同じ。変わらないものに目をつけると、1回のわり算で答えが出る。
  principle_en: Both ages grow by the same amount, so their difference never changes; anchoring on that invariant turns the search into one division.
problem:
  text_ja: 現在、父は44歳、健太は12歳です。父の年齢が健太の年齢の3倍になるのは何年後ですか。
  unit: 年後
  figure:
