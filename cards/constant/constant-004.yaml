grounding:
  principle_ja: 何年前でも、2人の年れいの差は同じ。2倍のときは、差がちょうど小さいほうの年れいになる。
  principle_en: The age difference never changes; at the moment of 'twice', the difference equals the younger age.
problem:
  text_ja: いま、兄は14才、弟は8才です。兄の年れいが弟の年れいの2倍だったのは何年前ですか。
  unit: 年前
  figure:
    type: word_problem
    kind: age_ratio_past
    params:
      p: 14
      c: 8
      r: 2
    names:
      older: 兄
      younger: 弟
answer:
  value: '2'
  display_ja: 2年前
  expr: word_problem
trap_route:
  time_cost_sec: 60
  time_source: estimate
  steps:
  - ja: 1年前、2年前…と、2人の年れいを表に書いてさかのぼる
    op: note
  - ja: 毎回「2倍になったか」を確かめる
    op: note
  - ja: ここで約1分
    op: note
lens_route:
  time_cost_sec: 15
  time_source: estimate
  steps:
  - ja: 年れいの差は 14−8 = 6 で、何年前でも変わらない
    op: note
  - ja: 兄が弟の2倍のとき、差の6は弟の 2−1 = 1 つ分
    op: note
  - ja: そのときの弟は 6÷1 = 6 才
    op: note
  - ja: 8−6 = 2（年前）
    value: '2'
    op: result
trigger:
  ja: 2人の年れいが同じだけ変わるときは、変わらない「差」に目をつける。
  en: 'Two ages changing together: anchor on the difference.'
