    op: note
  - ja: ここで約2分半。式の立て方で迷いやすい
    op: note
lens_route:
  time_cost_sec: 25
  time_source: estimate
  steps:
  - ja: 年齢の差は 46−18 = 28 で、何年前でも変わらない
    op: note
  - ja: 母が美咲の5倍のとき、差の28は美咲の 5−1 = 4 つ分
    op: note
  - ja: そのときの美咲は 28÷4 = 7 歳
    op: note
  - ja: 18−7 = 11（年前）
    value: '11'
    op: result
