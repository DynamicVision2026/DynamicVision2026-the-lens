schema_version: "1.1"
id: constant-001
kind: standard
lens: constant
best_move: constant
stage: shogakko
grades: [小4, 小5]
level: 2             # 1 基礎 · 2 標準 · 3 応用 · 4 発展
archetype: constant.age_ratio
status: verified

provenance:
  original: true
  built_from: "Archetype: two ages growing together; find when one is r times the other using the unchanging difference (差一定)."
  not_derived_from: "Numbers, story and wording are original. Not adapted from any 入試, textbook or 塾 problem."
  author: "The Lens content team"

grounding:
  principle_ja: "2人は同じだけ年をとるので、年れいの差はずっと同じ。変わらないものに目をつけると、1回のわり算で答えが出る。"
  principle_en: "Both ages grow by the same amount, so their difference never changes; anchoring on that invariant turns the search into one division."

problem:
  text_ja: "いま、お父さんは38才、子どもは8才です。お父さんの年れいが子どもの年れいの3倍になるのは何年後ですか。"
  unit: "年後"
  figure:
    type: word_problem
    kind: age_ratio
    params: {p: 38, c: 8, r: 3}
    names: {older: お父さん, younger: 子ども}

answer:
  value: "7"
  display_ja: "7年後"
  expr: word_problem

trap_route:
  time_cost_sec: 150
  time_source: estimate
  steps:
    - {ja: "1年後、2年後、3年後…と、2人の年れいを表に書いていく", op: note}
    - {ja: "毎回「3倍になったか」をわり算で確かめる", op: note}
    - {ja: "ここで約2分半。表が長くなる", op: note}

lens_route:
  time_cost_sec: 25
  time_source: estimate
  steps:
    - {ja: "年れいの差は 38−8 = 30 で、何年たっても変わらない", op: note}
    - {ja: "お父さんが子どもの3倍のとき、差の30は子どもの 3−1 = 2 つ分", op: note}
    - {ja: "そのときの子どもは 30÷2 = 15 才", op: note}
    - {ja: "15−8 = 7（年後）", value: "7", op: result}

trigger:
  ja: "2人の年れいが同じだけふえるときは、変わらない「差」に目をつける。"
  en: "Two ages growing together: anchor on the difference, which never changes."
  tags: [ages_both_increase, times_relation]

picker:
  options: [constant, area, freeze, direct]
  correct: constant
  clue_distractors: [two_kinds_mixed, moving_points]
  feedback_ja:
    constant: "そのとおり。年れいの差30はずっと同じなので、その差を「何つ分」で考えられる。"
    area: "2種類のものの数と合計の問題ではない。"
    freeze: "動く点の速さの問題ではない。"
    direct: "1年ずつ表にすると、答えまでに何行も書くことになる。"

animation:
  keyframes: [show_story, draw_age_bars, mark_difference, grow_bars, split_difference, show_answer]

checks:
  - {type: wp_formula}
  - {type: wp_unique}
  - {type: wp_nontrivial}
  - {type: wp_text_matches}
  - {type: route_steps_sum, route: lens_route}
  - {type: lens_faster}

variants:
  generator: wp_age_ratio
  count: 3
  seed: 2401
