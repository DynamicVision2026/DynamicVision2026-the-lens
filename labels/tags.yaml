# Japanese labels for clue chips (trigger.tags and picker.clue_distractors).
# generic: true = true of almost every card in its lens; shown as context, never offered as a clue chip.
grid:                 {ja: 方眼の上の図形,               generic: true}
tilted_polygon:       {ja: ななめにかたむいた図形}
vertices_on_box:      {ja: 頂点が外わくの上にある}
vertices_inside_box:  {ja: 頂点が外わくの内側にある}
concave_polygon:      {ja: へこんだ図形}
triangle:             {ja: 三角形,                       generic: true}
base_on_grid_line:    {ja: 底辺が方眼の線の上にある}
no_side_on_grid_line: {ja: どの辺も方眼の線に乗っていない}
parallel_lines:       {ja: 平行な線がある}
solid_3d:             {ja: 立体の図}
shortest_path:        {ja: いちばん短い道すじ}
moving_points:        {ja: 動く点がある}
mixing:               {ja: 2つのものを混ぜる}
triangles_between_parallels: {ja: 平行な2本の線の間に三角形がならぶ}
apexes_on_one_line:   {ja: 頂点が同じ直線の上にある}
only_total_given:     {ja: 1つ1つの長さは分からず、合計だけ分かる}
touch_a_line:         {ja: とちゅうで直線に1回ふれる}
two_points_same_side: {ja: 2つの点が直線の同じ側にある}
two_kinds_mixed:      {ja: 2種類のものがまざっている}
total_count_and_total: {ja: 全部の数と、全部の合計が分かる}
ages_both_increase:   {ja: 2人とも同じだけ年をとる}
times_relation:       {ja: 「何倍」になるときを聞いている}
three_strengths_known: {ja: 2つのこさと、混ぜたあとのこさが分かる}
toward_each_other:    {ja: 2人が向かい合って進む}
path_on_surface:      {ja: 立体の表面を通る道すじ}
two_averages_known:   {ja: 2つの組の平均と、全体の平均が分かる}
two_ways_to_share:    {ja: 2通りの配り方で、あまりと不足が分かる}
both_change_same:     {ja: 2人とも同じだけふえる・へる}
two_with_equal_counts: {ja: 2つの種類の数が同じ}
count_difference_given: {ja: 数の「差」は分かるが、全部の数は分からない}
each_count_known:     {ja: それぞれの数がもう分かっている}
asks_sum_later:       {ja: 何倍かではなく、何年後の「和」を聞いている}
one_vs_sum_of_many:   {ja: 1人と、何人かの合計をくらべる}
two_ratios_known:     {ja: いまと何年後の、2つの比が分かる}
add_water_or_salt:    {ja: 水や食塩を加える（水は0%、食塩は100%）}
mix_then_dilute:      {ja: 混ぜたあと、さらに水を加える}
evaporate_water:      {ja: 水を蒸発させる（食塩の量は変わらない）}
amount_not_strength:  {ja: こさではなく、食塩の量を聞いている}
head_start:           {ja: 先に出発した人を、あとから追いかける}
lengths_of_both:      {ja: 2つのものの長さも速さも分かる}
clock_hands:          {ja: 時計の長針と短針}
speed_changes_midway: {ja: とちゅうで速さが変わる}
total_time_and_distance: {ja: かかった時間の合計と、道のりの合計が分かる}
never_meet:           {ja: 2人は出会わない・追いつかない（それぞれの時間を聞いている）}
coordinates_given:    {ja: 頂点の座標が分かっている}
point_on_axis:        {ja: 軸の上に点をとる}
equal_area_asked:     {ja: 面積が等しくなる点を聞いている}
sum_of_distances:     {ja: 2つのきょりの和がいちばん短い}
cevians_ratio:        {ja: 三角形の辺を分ける比が2つ分かる}
