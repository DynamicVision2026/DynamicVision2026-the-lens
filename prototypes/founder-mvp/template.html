<title>視点レンズ Founder MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app. Home = lens case (8 tiles). Lens = stage (figure you touch) + side panel (pick → clue → play → aha). Single deliberate dark look: the Shorts' navy. */
:root {

}
html, body { height: 100%; }

button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
.app { min-height: 100%; display: flex; flex-direction: column; padding: 14px 16px 20px; max-width: 1280px; margin: 0 auto; box-sizing: border-box; gap: 12px; }

.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.brand .tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--paper); background: var(--lens); padding: 3px 8px; border-radius: 4px; font-weight: 700; }
.lede { color: var(--quiet); margin: 0; max-width: 60ch; line-height: 1.7; }
.case { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 150px; transition: transform .08s ease, border-color .2s; }
.tile:active { transform: scale(.97); }
.tile .ring { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--c); box-shadow: 0 0 18px -4px var(--c); }
.tile .ring svg { width: 24px; height: 24px; }
.tile .nm { font-family: var(--display); font-weight: 900; font-size: 22px; }
.tile .hn { color: var(--quiet); font-size: 12px; line-height: 1.5; }
.tile .dots { display: flex; gap: 4px; margin-top: auto; }
.tile .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.tile .dots i.on { background: var(--c); box-shadow: 0 0 6px var(--c); }
.tile.done { border-color: var(--c); }
.foot { color: var(--quiet); font-size: 12px; line-height: 1.6; }
/* ---------- lens screen ---------- */
.bar { display: flex; align-items: center; gap: 10px; }
.back { background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--lens); color: var(--lens); border-radius: 999px; padding: 4px 12px; font-family: var(--display); font-weight: 700; }
.chip svg { width: 18px; height: 18px; }
.pdots { margin-left: auto; display: flex; gap: 6px; }
.pdots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.pdots i.cur { background: var(--ink); }
.pdots i.on { background: var(--lens); }
.qtext { font-size: clamp(16px, 2.1vw, 19px); line-height: 1.75; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: 0; }
.main { display: grid; grid-template-columns: 1fr; gap: 12px; flex: 1; min-height: 0; }

.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 300px; display: flex; }
.stage svg.fig { width: 100%; height: auto; display: block; max-height: 68vh; margin: auto; }
.stage canvas.gl { width: 100%; height: 100%; display: block; min-height: 380px; }
.stage .lbls { position: absolute; inset: 0; pointer-events: none; }
.stage .lbls span { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 700; font-size: 15px; text-shadow: 0 0 6px var(--paper), 0 0 2px var(--paper); white-space: nowrap; }
.stage.glow { box-shadow: 0 0 0 2px var(--lens), 0 0 40px -6px var(--lens); transition: box-shadow .25s; }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hint { position: absolute; left: 12px; right: 12px; bottom: 10px; text-align: center; font-size: 14px; color: var(--ink); pointer-events: none; }

.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.try { font-size: 14px; line-height: 1.7; background: var(--raise); border-radius: 12px; padding: 10px 12px; border: 1px dashed var(--line); }
.try b { color: var(--flag); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cl { min-height: 44px; padding: 8px 14px; border-radius: 999px; background: var(--raise); border: 1.5px solid var(--line); font-size: 14px; transition: transform .08s; }
.cl:active { transform: scale(.95); }
.cl.yes { border-color: var(--lens); color: var(--lens); box-shadow: 0 0 14px -4px var(--lens); }
.cl.no { opacity: .4; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; gap: 10px; align-items: baseline; line-height: 1.6; font-size: 15px; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }

.steps li i { width: 10px; height: 10px; border-radius: 3px; flex: none; transform: translateY(1px); }

.answer.in { opacity: 1; transform: none; }

.go:active { transform: scale(.97); }
.go.ghost { background: var(--raise); color: var(--ink); border: 1px solid var(--line); }
.trigger { font-size: 14px; line-height: 1.7; color: var(--ink); border-left: 3px solid var(--lens); padding-left: 10px; }
.why { font-size: 13px; color: var(--quiet); line-height: 1.6; }
.guide { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: flex-end; gap: 4px; pointer-events: none; max-width: calc(100% - 20px); z-index: 3; }
.guide .bot { width: 64px; height: 74px; flex: none; animation: bob 2.6s ease-in-out infinite; }
.guide .bot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.guide .bot.pop { animation: pop .5s cubic-bezier(.2, 1.8, .4, 1), bob 2.6s ease-in-out .5s infinite; }
.bubble { position: relative; background: #E8ECF4; color: #0D1424; font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.45; padding: 9px 13px; border-radius: 14px; margin-bottom: 40px; box-shadow: 0 6px 18px -8px rgba(0,0,0,.6); max-width: 34ch; }
.bubble::before { content: ""; position: absolute; left: -7px; bottom: 12px; border: 8px solid transparent; border-right-color: #E8ECF4; border-left: 0; }
.bubble.say { animation: say .28s ease; }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes pop { 0% { transform: scale(.7) } 100% { transform: scale(1) } }

.finger { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.85) 0 28%, rgba(255,255,255,.25) 30% 60%, transparent 62%); box-shadow: 0 0 0 2px rgba(255,255,255,.5); pointer-events: none; z-index: 4; opacity: 0; }
svg .halo { opacity: 0; }
svg .pulse .halo { animation: halo 1.1s ease-in-out 3; }

/* =====================================================================

    const c = LENSC[l.lens], n = l.problems.length, got = (solved[l.lens] || []).length;
    const t = H(`<button class="tile${got >= n ? ' done' : ''}" style="--c:${c}"><span class="ring">${icon(l.lens, c)}</span><span class="nm">${l.ja}</span><span class="hn">${l.hint}</span><span class="dots">${l.problems.map(p => `<i class="${(solved[l.lens] || []).includes(p.id) ? 'on' : ''}"></i>`).join('')}</span></button>`);

}
let cleanupScene = null;

  document.documentElement.style.setProperty('--lens', c);
  app.replaceChildren();
  const bar = H(`<div class="bar"><button class="back" aria-label="レンズケースへ">← ケース</button><span class="pdots">${l.problems.map((p, i) => `<i class="${i === state.pi ? 'cur' : (solved[l.lens] || []).includes(p.id) ? 'on' : ''}"></i>`).join('')}</span></div>`);

/* the locked preview shown while choosing the lens: the bare problem figure */
