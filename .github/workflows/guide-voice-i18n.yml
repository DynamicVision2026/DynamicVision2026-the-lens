name: Marketing video narration (English / 繁體中文)

# English and 繁體中文 narration for the つまずきマップ marketing videos: Google Cloud Text-to-Speech speaks
# apps/snap/video/narration.<lang>.json via apps/snap/video/make_narration_i18n.py, signed in to Google through
# the repo's workload identity (main only). The WAVs go to the branch guide/voice-i18n-out (nothing deployed).
# Run from the Actions tab ("Run workflow") on main.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

env:
  PROVIDER: projects/453311523826/locations/global/workloadIdentityPools/github/providers/github-repo
  DEPLOYER: github-deployer@shiten-lens-511712.iam.gserviceaccount.com

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Narration
        run: python3 apps/snap/video/make_narration_i18n.py
      - name: Push to guide/voice-i18n-out
        run: |
          git config user.name "lens-voice-bot"
          git config user.email "lens-voice-bot@users.noreply.github.com"
          git checkout -B guide/voice-i18n-out
          git add -f apps/snap/video/audio-i18n
          git commit -m "Marketing video narration (Google TTS): en, zh-Hant"
          git push -f origin guide/voice-i18n-out
