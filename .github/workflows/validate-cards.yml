name: Validate Lens Cards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator dependencies
        run: pip install -r requirements.txt

      - name: Validate tokens.json is well-formed
        run: python -c "import json; json.load(open('tokens/tokens.json', encoding='utf-8'))"

      - name: Validate every Lens Card and build the bundle
        run: |
          shopt -s globstar nullglob
          cards=(cards/**/*.yaml)
          if [ ${#cards[@]} -eq 0 ]; then echo "No cards found"; exit 1; fi
          python tools/validate.py "${cards[@]}" --bundle

      - name: Upload bundle and variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-bundle
          path: build/
          if-no-files-found: ignore

  apps:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator dependencies
        run: pip install -r requirements.txt

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build the bundle
        run: pnpm bundle

      - name: No hex colour literals in scenes and apps
        run: pnpm check:literals
      - name: CSS rules all close (no accidental nesting)
        run: pnpm check:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the trainer
        run: pnpm build

      # Draft cards (new lenses) are left out of the app bundle until their scenes ship, but their
      # scenes are built and tested before that, so the unit tests run on a drafts-included bundle.
      - name: Bundle including drafts
        run: pnpm bundle:drafts

      - name: Unit tests (drafts included)
        run: pnpm test
