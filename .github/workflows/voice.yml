name: Generate mascot voice

# WO-022 §2 (and WO-028: the YouTube Shorts lines): makes the masterclass mascot clips (VOICEVOX 春日部つむぎ) on GitHub's runner, so nobody has to
# download the VOICEVOX app. Runs the official engine image as a service, then tools/make_voice.py against it,
# and pushes the clips to the branch `voice/clips` for a normal PR (CI and review run on that PR).
# Start it from the Actions tab ("Run workflow"), or: gh workflow run voice.yml

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Regenerate every clip (otherwise only new or changed lines)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          pip install pyyaml
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Wait for the VOICEVOX engine
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:50021/version && exit 0
            sleep 2
          done
          echo "VOICEVOX engine did not start" && exit 1

      - name: Generate clips
        run: python3 tools/make_voice.py ${{ inputs.all && '--all' || '' }}

      - name: Push to voice/clips
        run: |
          git config user.name "lens-voice-bot"
          git config user.email "lens-voice-bot@users.noreply.github.com"
          git checkout -B voice/clips
          git add apps/trainer/public/audio/mc apps/shorts/public/voice
          if git diff --cached --quiet; then echo "No clip changes."; exit 0; fi
          git commit -m "Mascot voice clips (VOICEVOX:春日部つむぎ), generated by the voice workflow"
          git push -f origin voice/clips
          echo "Clips pushed to voice/clips. Open a PR from it to main." >> "$GITHUB_STEP_SUMMARY"
