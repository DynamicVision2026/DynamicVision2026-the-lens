    example1: "変わらない差を、いくつ分で見る"
    example2: "お金でも、差は変わらない"
    boundary: "差が変わるときは使わない"
    onboarding: "練習は3ステップ"
  say:
    principle: "母の年齢が5倍だったのは何年前？"
    principle_turn: "式の向きで迷う…。どうする？"
    principle_lens: "和差一定レンズ！ 年齢の差は変わらない"
    example1: "差のテープを、いくつ分に分けよう"
    example1_done: "差÷（倍−1）で、そのときの年齢"
    example2: "同じ金額を使っても、差はそのまま"
    example2_done: "変わらないものを見つければ速い"
    boundary: "でも、3人の合計と比べるなら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

