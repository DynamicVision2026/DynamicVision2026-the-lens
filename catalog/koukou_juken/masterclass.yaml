    principle_lens: "てんびんレンズ！ 濃度をうでにのせよう"
    example1: "支点を混ぜたあとの濃度に合わせよう"
    example1_done: "重さの比は、うでの長さの逆の比"
    example2: "食塩だけ加えるなら、100%とてんびん"
    example2_done: "水は0%、食塩は100%と考える"
    boundary: "でも、水を蒸発させるだけなら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

