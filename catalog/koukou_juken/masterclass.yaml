  example1: kj-freeze-002
  example2: kj-freeze-003
  boundary: kj-freeze-f01
  try: kj-freeze-001
  title:
    principle: "x分後の位置を式にしたくなる"
    example1: "弟を止めて、差で近づく"
    example2: "列車も、片方を止める"
    boundary: "動くのが1人なら使わない"
    onboarding: "練習は3ステップ"
  say:
    principle: "兄が弟に追いつくのは何分後？"
    principle_turn: "出発時刻がずれて迷う…。どうする？"
    principle_lens: "止めるレンズ！ 弟を止めてみよう"
    example1: "弟をタップして、止めてみよう！"
    example1_done: "近づく速さは、速さの差"
    example2: "すれちがう列車も、片方を止める"
    example2_done: "長さの和を、速さの和で進む"
    boundary: "でも、1人が速さを変えるだけなら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

