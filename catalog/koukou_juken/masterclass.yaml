# Masterclass + practice onboarding for each lesson of the 高校受験パス (Step 1). Same player and standard as
# chugaku_juken (WO-014, tokens motion.masterclass: 360 s = core 300 + onboarding 60). Architect-owned content.
# Tone: the same mascot, a little older: 中学生に向けて、短く、方程式との対比で。say / title ≤ 32 characters.

enclose:
  example1: kj-enclose-002
  example2: kj-enclose-004
  boundary: kj-enclose-f01
  try: kj-enclose-001
  title:
    principle: "辺の長さを三平方で出したくなる"
    example1: "座標でも、囲んですみを引く"
    example2: "どの辺もななめでも、同じ"
    boundary: "対角線が軸の上なら、分ける"
    onboarding: "練習は3ステップ"
  say:
    principle: "座標の四角形。面積はどう出す？"
    principle_turn: "辺も高さもななめ…。どうする？"
    principle_lens: "囲むレンズ！ 軸に平行な長方形で囲もう"
    example1: "ゴーストの指をまねして、囲んでみよう"
    example1_done: "すみの三角形は、座標の差で読める"
    example2: "こんどは四角形。同じ手順でいける？"
    example2_done: "形が変わっても、囲んで引くだけ"
    boundary: "でも、対角線が軸の上にあるなら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

slide:
  example1: kj-slide-001
  example2: kj-slide-002
  boundary: kj-slide-f01
  try: kj-slide-003
  title:
    principle: "Pを(0, p)とおきたくなる"
    example1: "平行線の上なら、面積は同じ"
    example2: "傾きが変わっても、平行線"
    boundary: "そろえる相手がないときは"
    onboarding: "練習は3ステップ"
  say:
    principle: "面積が等しくなる点P。どこにある？"
    principle_turn: "方程式は場合分けで重い…。どうする？"
    principle_lens: "等積変形レンズ！ 平行な直線をひこう"
    example1: "Cを、ABに平行にすべらせてみよう"
    example1_done: "底辺が同じで高さが同じなら、同じ面積"
    example2: "ちがう座標でも、同じ考え方"
    example2_done: "平行線の式を出せば、Pが決まる"
    boundary: "でも、面積の値だけ分かるなら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

mirror:
  example1: kj-mirror-004
  example2: kj-mirror-001
  boundary: kj-mirror-f01
  try: kj-mirror-003
  title:
    principle: "AとBのまん中をとりたくなる"
    example1: "x軸で折り返して、まっすぐ"
    example2: "折り返したら、次は囲む"
    boundary: "差の最大なら、折り返さない"
    onboarding: "練習は3ステップ"
  say:
    principle: "AP＋PBが最短になるP。どこ？"
    principle_turn: "まん中では最短にならない…。どうする？"
    principle_lens: "折り返すレンズ！ Bをx軸で折り返そう"
    example1: "BをB'に折り返して、Aとまっすぐ結ぼう"
    example1_done: "まっすぐな線とx軸の交点がP"
    example2: "Pが決まったら、△ABPの面積も出せる"
    example2_done: "レンズは2つ続けて使える"
    boundary: "でも、差が最大になる点なら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

area:
  example1: kj-area-002
  example2: kj-area-003
  boundary: kj-area-f01
  try: kj-area-001
  title:
    principle: "連立方程式を立てたくなる"
    example1: "長方形2つで、差を読む"
    example2: "平均も、面積図で"
    boundary: "全体の数がないときは"
    onboarding: "練習は3ステップ"
  say:
    principle: "大人と中学生、合わせて何人？"
    principle_turn: "xとyの式を2本…重い。どうする？"
    principle_lens: "面積図レンズ！ 長方形2つでならべよう"
    example1: "全部中学生だとして、はみ出しを見よう"
    example1_done: "はみ出した面積÷縦の差で、答え"
    example2: "平均の線の上と下を比べてみよう"
    example2_done: "はみ出しとへこみは、同じ面積"
    boundary: "でも、全体の数が分からないなら…"
    onboarding: "手がかり → 道具 → ドラッグ。ヒントなしで"
    onboarding_done: "準備OK！ 5問、ひとりでやってみよう"

