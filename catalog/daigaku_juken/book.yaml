  front_matter:
    hajimeni_ja: |-
      大学入試の数学で差がつくのは、式を立てる前の「何を固定し、どこから見るか」の判断です。
      この本は、内分の比をてんびんで見る、文字を1つ止めて考えるといった視点（レンズ）を、座標や公式に頼る遠回りと並べて練習するための問題集です。
    tsukaikata_ja:
      - 章のはじめの例題で、左ページの「くせでやると」と右ページの「レンズで見ると」を見比べる
      - 「レンズが使えないとき」で、そのレンズより直接計算が速い問題を知る
      - 練習問題は、解く前に「どのレンズ？」の□にレンズ名を書いてから解く
      - 最後の「どのレンズ？」総まとめで、単元をまぜて選ぶ練習をする
    qr_ja: 各章のQRコードから、同じ考え方を動かして確かめられます（Webアプリ「視点レンズ」）。
    honesty_ja: この本は点数を約束するものではありません。最初の一手を決めるまでの時間を短くするための練習帳です。
    parent_ja: 1日1章の半分（20〜30分）が目安です。
