book:
  id: lens-book-chugaku-1
  status: proof                # building → proof → live (live needs amazon_url); WO-026
  series_ja: 視点レンズ（The Lens）
  title_ja: 中学受験算数 視点レンズ
  subtitle_ja: 解き始めを速くする8つのレンズ　4週間ワークブック    # Brian, Oct 16: exam word first (Amazon search), benefit without a score promise
  audience_ja: 小5〜小6・中学受験
  author_ja: Brian Fu
  publisher_ja: Beyond Culture 獨步文化株式会社
  interior: standard_color     # KDP 標準カラー on white paper (Brian, Oct 16); every distinction still has an icon or pattern
  amazon_url: null             # set after KDP publishing; the trainer links to it (WO-021 §4)
  price_jpy: 2100               # KDP list price, Brian Oct 16 (WO-027 §5)
  practice_variants: 1         # extra 類題 per practice card, from its validated variants
  review: {count: 16, seed: 4101}    # final chapter 「どのレンズ？」: mixed variants, pick the lens before solving
  qr: "https://lens.domo-ai.com/lesson/{pass}/{lens}?src=book"
  front_matter:
    hajimeni_ja: |-
      算数の入試問題で時間がかかるのは、計算そのものより「どう解き始めるか」で手が止まる時間です。
      この本は、図形と特殊算をまたいで使える8つの視点（レンズ）を、1つずつ身につけるための問題集です。
      各章では同じ問題を「くせでやると（わな）」と「レンズで見ると」の2通りで並べ、どこで遠回りになるかを見比べられるようにしました。
    tsukaikata_ja:
      - 章のはじめの例題で、左ページの「くせでやると」と右ページの「レンズで見ると」を見比べる
      - 「レンズが使えないとき」「ここは別のレンズ」で、そのレンズが向かない問題を知る
      - 練習問題は、解く前に「どのレンズ？」の□にレンズ名を書いてから解く
      - 最後の「どのレンズ？」総まとめで、単元をまぜて選ぶ練習をする
    qr_ja: 各章のQRコードから、同じ考え方を指で動かして確かめられます（Webアプリ「視点レンズ」）。
    honesty_ja: この本は点数を約束するものではありません。最初の一手を決めるまでの時間を短くするための練習帳です。
    parent_ja: おうちの方へ：1日1章の半分（15〜20分）が目安です。4週間の進め方は、Webアプリの「4週間完成スケジュール」をご覧ください。
