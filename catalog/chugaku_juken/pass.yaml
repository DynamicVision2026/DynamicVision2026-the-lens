# Catalog: chugaku_juken/ holds exactly one Pass (one Shopify SKU). Architect-owned.
# Strict isolation: a Pass lists only cards whose `stage` is in its card_stages, and no card id
# may appear in two Passes. Shared engine, schema, picker and scene renderers (ADR-001, ADR-003).
# The validator loads catalog/*/pass.yaml; `--release chugaku_juken` fails unless this Pass is complete.

chugaku_juken:
  stage_no: 1
  title_ja: 中学受験パス
  product_en: Elementary Sprint
  audience_ja: 小4〜小6・中学受験
  card_stages: [shogakko]
  status: building            # building → preorder → live
  sku: LENS-CJ-12M            # Shopify variant SKU; the access Worker maps SKU → pass
  price_jpy: 9800
  early_price_jpy: 6800        # founder edition: first 30 families only; then price_jpy (Brian, Oct 13)
  founder_seats: 30
  term_months: 12
  devices: 3
  lesson_target: 5            # Founder MVP (Brian, Oct 13): 5 curated problems per lens, 40 total
  levels: {1: 基礎, 2: 標準, 3: 応用, 4: 発展}
  review_set: {size: 10, no_lens_items: 2}   # mixed toolkit review: pick the lens, all lessons mixed
  lessons:
    - {lens: enclose,  video: lesson-enclose,  cards: [enclose-002, enclose-004, enclose-no-lens, enclose-001, enclose-003, enclose-008, enclose-005, enclose-006, enclose-f01, enclose-007]}
    - {lens: slide,    video: lesson-slide,    cards: [slide-002, slide-001, slide-003]}   # WO-018 drafts (drawing pending): slide-no-lens, slide-f01, slide-004
    - {lens: area,     video: lesson-area,     cards: [area-002, area-001, area-no-lens, area-004, area-003, area-007, area-f01, area-008, area-006, area-005]}
    - {lens: constant, video: lesson-constant, cards: [constant-004, constant-001, constant-no-lens, constant-002, constant-003, constant-008, constant-006, constant-f01, constant-007, constant-005]}
    - {lens: balance,  video: lesson-balance,  cards: [balance-002, balance-001, balance-no-lens, balance-003, balance-006, balance-f01, balance-005, balance-007, balance-004]}
    - {lens: freeze,   video: lesson-freeze,   cards: [freeze-002, freeze-001, freeze-no-lens, freeze-003, freeze-006, freeze-f01, freeze-005, freeze-007, freeze-004]}
    - {lens: mirror,   video: lesson-mirror,   cards: [mirror-002, mirror-001, mirror-003]}   # WO-018 draft (drawing pending): mirror-no-lens
    - {lens: unfold,   video: lesson-unfold,   cards: [unfold-002, unfold-001, unfold-003]}
